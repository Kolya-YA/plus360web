baseURL = "https://plus360.eu/"
locale = "de-DE"
defaultContentLanguage = 'de'
defaultContentLanguageInSubdir = false
disableDefaultLanguageRedirect = false
theme = "theme-plus360"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]

title = "plus360 Webatelier & Webwerkstatt"

[markup]
[markup.goldmark]
[markup.goldmark.parser]
[markup.goldmark.parser.attribute]
block = true
[markup.goldmark.renderer]
unsafe = true

[params]
description = "Wir entwickeln benutzerfreundliche Websites unter Berücksichtigung von Barrierefreiheit für alle."
titleWord = "plus"
titleDigit = "360"
department = ""
email = "info@plus360.eu"
phone = ""
phoneLink = ""
instagramLink = "https://www.instagram.com/plus360.eu/"
facebookLink = "https://www.facebook.com/plus360"

[languages]
[languages.de]
weight = 1
label = 'Deutsch'
locale = 'de-DE'
# [languages.en]
# weight = 2
# label = 'English'
# locale = 'en'
[languages.ru]
weight = 3
label = 'Русский'
locale = 'ru-RU'
